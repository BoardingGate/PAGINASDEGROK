<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guías de viaje</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #12141a;
      color: #f2f4f8;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      line-height: 1.5;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 4rem;
    }
    h1 {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.6rem;
    }
    p {
      font-size: 1.35rem;
      color: #c5cad6;
      margin: 0 0 2rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li + li {
      margin-top: 0.85rem;
    }
    a {
      display: block;
      font-size: 1.6rem;
      font-weight: 700;
      color: #f7f1e3;
      text-decoration: none;
      background: #1c2030;
      border: 1px solid #343a4d;
      border-radius: 0.7rem;
      padding: 1.15rem 1.3rem;
    }
    a:hover,
    a:focus {
      background: #262c40;
      border-color: #8eb4ff;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Guías de viaje</h1>
    <p>Itinerarios para leer antes de salir.</p>
    <ul>
      <li><a href="coruna-3dias/">A Coruña en 3 días</a></li>
      <li><a href="caboverde-1semana/">Cabo Verde · 1 semana (Sal y Boa Vista, feb 2027)</a></li>
    </ul>
  </main>
</body>
</html>
